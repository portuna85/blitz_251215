name: Deploy to Production (Manual)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to deploy'
        required: true
        default: 'latest'
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - production
          - staging

env:
  JAVA_VERSION: '21'

jobs:
  deploy:
    name: Manual Deploy
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: 'temurin'
        cache: 'gradle'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew clean bootJar -x test --no-daemon

    - name: Setup SSH
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

    - name: Create .env file
      run: |
        cat > .env << EOF
        # Database Configuration
        DB_URL=${{ secrets.DB_URL }}
        DB_USERNAME=${{ secrets.DB_USERNAME }}
        DB_PASSWORD=${{ secrets.DB_PASSWORD }}
        
        # Redis Configuration
        REDIS_HOST=${{ secrets.REDIS_HOST }}
        REDIS_PORT=${{ secrets.REDIS_PORT }}
        REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}
        
        # MinIO Configuration
        MINIO_URL=${{ secrets.MINIO_URL }}
        MINIO_ACCESS_KEY=${{ secrets.MINIO_ACCESS_KEY }}
        MINIO_SECRET_KEY=${{ secrets.MINIO_SECRET_KEY }}
        MINIO_BUCKET=${{ secrets.MINIO_BUCKET }}
        
        # OAuth Configuration
        GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
        GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}
        NAVER_CLIENT_ID=${{ secrets.NAVER_CLIENT_ID }}
        NAVER_CLIENT_SECRET=${{ secrets.NAVER_CLIENT_SECRET }}
        
        # Server Configuration
        SERVER_PORT=8080
        SPRING_PROFILES_ACTIVE=real,oauth,real-db,minio
        EOF

    - name: Deploy to ${{ github.event.inputs.environment }}
      run: |
        echo "🚀 Deploying version ${{ github.event.inputs.version }} to ${{ github.event.inputs.environment }}"
        
        # JAR 파일 전송
        scp -i ~/.ssh/id_rsa build/libs/*.jar ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:~/apps/blitz/
        
        # .env 파일 전송
        scp -i ~/.ssh/id_rsa .env ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:~/apps/blitz/
        
        # 배포 스크립트 전송
        scp -i ~/.ssh/id_rsa scripts/deploy.sh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:~/apps/blitz/
        
        # 배포 실행
        ssh -i ~/.ssh/id_rsa ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'EOF'
          cd ~/apps/blitz
          chmod +x deploy.sh
          ./deploy.sh
        EOF

    - name: Verify deployment
      run: |
        echo "⏳ Waiting for application to start..."
        sleep 30
        
        HEALTH_URL="http://${{ secrets.SERVER_HOST }}:8080/actuator/health"
        RESPONSE=$(curl -s $HEALTH_URL || echo "failed")
        
        if echo "$RESPONSE" | grep -q "UP"; then
          echo "✅ Deployment successful!"
          echo "🌐 Application is running at: http://${{ secrets.SERVER_HOST }}:8080"
        else
          echo "❌ Health check failed!"
          exit 1
        fi

    - name: Create deployment summary
      if: always()
      run: |
        cat >> $GITHUB_STEP_SUMMARY << EOF
        # 🚀 Deployment Summary
        
        - **Environment**: ${{ github.event.inputs.environment }}
        - **Version**: ${{ github.event.inputs.version }}
        - **Status**: ${{ job.status }}
        - **Deployed by**: ${{ github.actor }}
        - **Timestamp**: $(date -u '+%Y-%m-%d %H:%M:%S UTC')
        
        ## 📊 Details
        - **Server**: ${{ secrets.SERVER_HOST }}
        - **Health Check**: http://${{ secrets.SERVER_HOST }}:8080/actuator/health
        EOF

