name: Build Check (PR)

on:
  pull_request:
    branches: [ main, develop ]
    types: [opened, synchronize, reopened]

env:
  JAVA_VERSION: '21'

jobs:
  # 빌드 검증
  build-check:
    name: Build Verification
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: 'temurin'
        cache: 'gradle'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Compile
      run: ./gradlew compileJava --no-daemon

    - name: Build
      run: ./gradlew build -x test --no-daemon

    - name: Check build artifacts
      run: |
        if [ -f build/libs/*.jar ]; then
          echo "✅ Build artifacts created successfully"
          ls -lh build/libs/
        else
          echo "❌ Build artifacts not found"
          exit 1
        fi

  # 코드 품질 검사
  code-quality:
    name: Code Quality Check
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: 'temurin'
        cache: 'gradle'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Check code formatting
      run: |
        echo "📝 Checking code formatting..."
        # 추가적인 포맷팅 검사 도구 사용 가능

  # 보안 스캔
  security:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'table'
        exit-code: '0'
        ignore-unfixed: true
        severity: 'CRITICAL,HIGH'

  # PR 요약 생성
  pr-summary:
    name: PR Summary
    runs-on: ubuntu-latest
    needs: [build-check, code-quality]
    if: always()

    steps:
    - name: Create PR Summary
      run: |
        cat >> $GITHUB_STEP_SUMMARY << EOF
        # 🔍 Pull Request Check Summary
        
        ## Build Status
        - Build Check: ${{ needs.build-check.result == 'success' && '✅ Passed' || '❌ Failed' }}
        - Code Quality: ${{ needs.code-quality.result == 'success' && '✅ Passed' || '❌ Failed' }}
        
        ## Details
        - **PR**: #${{ github.event.pull_request.number }}
        - **Author**: @${{ github.event.pull_request.user.login }}
        - **Branch**: ${{ github.head_ref }}
        - **Target**: ${{ github.base_ref }}
        
        ---
        
        ⚠️ **Note**: Tests are currently disabled in build configuration
        EOF

