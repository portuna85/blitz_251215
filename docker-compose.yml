version: "3.8"

services:
  mariadb:
    image: mariadb:10.11
    container_name: blitz_mariadb
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_password}
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      TZ: ${DB_TIMEZONE}
    ports:
      - "${DB_PORT}:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_general_ci
      --default-time-zone=+09:00
    networks:
      - blitz_network

  redis:
    image: redis:7-alpine
    container_name: blitz_redis
    restart: always
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data
    networks:
      - blitz_network

  minio:
    image: minio/minio:latest
    container_name: blitz_minio
    restart: always
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_PORT}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    networks:
      - blitz_network

  app:
    image: ghcr.io/portuna85/blitz:latest   # 여기만 본인 GitHub로 교체
    container_name: blitz_app
    restart: always
    env_file:
      - .env
    depends_on:
      - mariadb
      - redis
      - minio
    ports:
      - "${SERVER_PORT}:8080"
    networks:
      - blitz_network

networks:
  blitz_network:
    driver: bridge

volumes:
  mariadb_data:
  redis_data:
  minio_data:
