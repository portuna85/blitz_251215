<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/header :: header}"></head>
<body>

<h1>게시글 수정</h1>

<div class="col-md-12">
    <div class="col-md-8">
        <form>
            <div class="form-group">
                <label for="id">글 번호</label>
                <input type="text" class="form-control" id="id" th:value="${post.id}" readonly>
            </div>
            <div class="form-group">
                <label for="title">제목</label>
                <input type="text" class="form-control" id="title" th:value="${post.title}">
            </div>
            <div class="form-group">
                <label for="author">작성자</label>
                <input type="text" class="form-control" id="author" th:value="${post.author}" readonly>
            </div>
            <div class="form-group">
                <label>조회수</label>
                <input type="text" class="form-control" th:value="${post.viewCount}" readonly>
            </div>
            <div class="form-group">
                <label for="content">내용</label>
                <textarea class="form-control" id="content" rows="10" th:text="${post.content}"></textarea>
            </div>
        </form>
        <a href="/" role="button" class="btn btn-secondary">목록</a>
        <th:block th:if="${userEmail != null and userEmail == post.authorEmail}">
            <button type="button" class="btn btn-primary" id="btn-update">수정 완료</button>
            <button type="button" class="btn btn-danger" id="btn-delete">삭제</button>
        </th:block>

        <hr class="my-4">

        <!-- 댓글 영역 -->
        <div class="comments-section">
            <h3>댓글 <span id="comment-count" class="badge bg-secondary">0</span></h3>

            <!-- 댓글 작성 폼 (로그인 시에만) -->
            <th:block th:if="${userEmail != null}">
                <div class="card mb-3">
                    <div class="card-body">
                        <textarea class="form-control mb-2" id="comment-content" rows="3" placeholder="댓글을 입력하세요..."></textarea>
                        <button type="button" class="btn btn-sm btn-primary" id="btn-comment-save">댓글 등록</button>
                    </div>
                </div>
            </th:block>

            <!-- 댓글 목록 -->
            <div id="comments-list"></div>
        </div>
    </div>
</div>

<th:block th:replace="~{layout/footer :: footer}"></th:block>
</body>
</html>
