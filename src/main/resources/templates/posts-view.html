<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/header :: header}"></head>
<body>

<h1>게시글 상세보기</h1>

<div class="col-md-12">
    <div class="col-md-8">
        <div class="card">
            <div class="card-body">
                <h2 class="card-title" th:text="${post.title}"></h2>
                <div class="text-muted mb-3">
                    <small>
                        작성자: <strong th:text="${post.author}"></strong> |
                        조회수: <strong th:text="${post.viewCount}"></strong> |
                        작성일: <strong th:text="${#temporals.format(post.modifiedDate, 'yyyy-MM-dd HH:mm')}"></strong>
                    </small>
                </div>
                <hr>
                <div class="card-text" style="white-space: pre-wrap;" th:text="${post.content}"></div>
            </div>
        </div>

        <div class="mt-3">
            <a href="/" role="button" class="btn btn-secondary">목록</a>
            <th:block th:if="${userEmail != null and userEmail == post.authorEmail}">
                <a th:href="@{/posts/update/{id}(id=${post.id})}" role="button" class="btn btn-primary">수정</a>
            </th:block>
        </div>

        <hr class="my-4">

        <!-- 댓글 영역 -->
        <div class="comments-section">
            <h3>댓글 <span id="comment-count" class="badge bg-secondary">0</span></h3>

            <!-- 댓글 작성 폼 (로그인 시에만) -->
            <th:block th:if="${userEmail != null}">
                <div class="card mb-3">
                    <div class="card-body">
                        <textarea class="form-control mb-2" id="comment-content" rows="3" placeholder="댓글을 입력하세요..."></textarea>
                        <button type="button" class="btn btn-sm btn-primary" id="btn-comment-save">댓글 등록</button>
                    </div>
                </div>
            </th:block>

            <!-- 댓글 목록 -->
            <div id="comments-list"></div>
        </div>
    </div>
</div>

<input type="hidden" id="id" th:value="${post.id}">

<th:block th:replace="~{layout/footer :: footer}"></th:block>
</body>
</html>
